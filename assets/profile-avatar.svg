<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="440" rx="36" fill="url(#bgGrad)"/>

  <!-- Subtle Tech Grid Lines -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="440"/>
    <line x1="120" y1="0" x2="120" y2="440"/>
    <line x1="200" y1="0" x2="200" y2="440"/>
    <line x1="280" y1="0" x2="280" y2="440"/>
    <line x1="360" y1="0" x2="360" y2="440"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="0" y1="400" x2="400" y2="400"/>
  </g>

  <!-- Radial Aura behind silhouette -->
  <circle cx="200" cy="210" r="110" fill="url(#glowGrad)" filter="url(#softGlow)"/>

  <!-- Developer Silhouette Artwork -->
  <!-- Head -->
  <circle cx="200" cy="165" r="54" fill="#cbd5e1"/>
  
  <!-- Hair / Professional styling silhouette -->
  <path d="M146 160 C146 105, 254 105, 254 160 C254 195, 240 205, 230 205 C215 205, 215 190, 200 190 C185 190, 185 205, 170 205 C160 205, 146 195, 146 160 Z" fill="#1e293b"/>

  <!-- Torso & Blazer Silhouette -->
  <path d="M120 330 C120 255, 155 240, 200 240 C245 240, 280 255, 280 330 L295 380 C295 400, 285 410, 260 410 L140 410 C115 410, 105 400, 105 380 Z" fill="#0f172a"/>

  <!-- Professional Shirt & Tie / Collar -->
  <polygon points="200,245 175,295 225,295" fill="#f8fafc"/>
  <polygon points="194,295 206,295 203,365 197,365" fill="#38bdf8"/>
  <polygon points="175,255 200,290 185,340 165,270" fill="#1e3a8a"/>
  <polygon points="225,255 200,290 215,340 235,270" fill="#1e3a8a"/>

  <!-- Tech Monogram Badge overlay at bottom -->
  <rect x="135" y="360" width="130" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="url(#accentGrad)" stroke-width="1.5"/>
  <text x="200" y="383" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#38bdf8" text-anchor="middle" letter-spacing="1">MADHUMITHA S.</text>
</svg>
